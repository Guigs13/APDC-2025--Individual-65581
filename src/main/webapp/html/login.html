<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    form { max-width: 400px; margin: auto; }
    input { width: 100%; padding: 8px; margin-bottom: 10px; }
    button { padding: 10px 20px; }
    p { font-weight: bold; }
  </style>
</head>
<body>
<h1>Login</h1>
<form id="loginForm">
  <input type="text" name="id" placeholder="Identifier" required />
  <input type="password" name="password" placeholder="Password" required />

  <button type="submit">Entrar</button>
  <button type="button" onclick="window.location.href='../index.html'">Voltar à Página Inicial</button>
</form>
<p id="loginResponse"></p>

<script>
  document.getElementById("loginForm").addEventListener("submit", async function(e) {
    e.preventDefault();
    const formData = new FormData(this);
    const jsonData = Object.fromEntries(formData.entries());

    const response = await fetch("/rest/login/v1b", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(jsonData)
    });

    const resultText = await response.text();
    document.getElementById("loginResponse").innerText =
            response.ok ? "Login com sucesso!" : "Erro: " + resultText;
  });
</script>
</body>
</html>
